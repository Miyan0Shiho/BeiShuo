version: '3.8'

services:
  backend:
    build:
      context: ./python
      dockerfile: Dockerfile
    container_name: beishuo-backend
    ports:
      - "8080:8080"
    environment:
      - ENV_FILE=.env
    volumes:
      - ./python/uploads:/app/uploads
      - ./python/.env:/app/.env
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: beishuo-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_BASE=http://localhost:8080
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: beishuo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data: