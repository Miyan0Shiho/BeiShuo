name: Frontend CI
on:
  push:
    branches:
      - feature/frontend*
      - feature/techTest
  pull_request:
    branches:
      - develop
    paths:
      - 'frontend/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: frontend
      - run: npm run lint --if-present
        working-directory: frontend
      - run: npm run type-check --if-present
        working-directory: frontend
      - run: npm run build
        working-directory: frontend