name: AI Service CI
on:
  push:
    branches:
      - feature/ai*
      - feature/techTest
  pull_request:
    branches:
      - develop
    paths:
      - 'ai-service/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: ai-service
      - name: Lint
        run: |
          pip install flake8 black
          flake8 .
          black --check .
        working-directory: ai-service
      - name: Tests
        run: pytest -q
        working-directory: ai-service