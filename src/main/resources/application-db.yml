# 数据库中间层服务配置
server:
  port: 8081
  servlet:
    context-path: /api/database

# 数据库配置
spring.datasource:
  driver-class-name: org.postgresql.Driver
  url: jdbc:postgresql://localhost:5432/beishuo
  username: beishuo
  password: beishuo123

# JPA配置
spring.jpa:
  hibernate:
    ddl-auto: update
  show-sql: true
  properties:
    hibernate:
      dialect: org.hibernate.dialect.PostgreSQLDialect
      format_sql: true

# 数据库API配置（指向自身）
database:
  api:
    base-url: http://localhost:8081/api/database
